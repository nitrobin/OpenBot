<text x="8" y="54" font-family="Noto Sans,Arial,sans-serif" font-size="18" fill="#203040" text-anchor="start" font-weight="normal">OLED не подключён: GPIO22 занят правым LM393. HAS_OLED 0.</text>
<text x="8" y="82" font-family="Noto Sans,Arial,sans-serif" font-size="18" fill="#203040" text-anchor="start" font-weight="normal">R1 / R2: батарея ÷ 4 → GPIO4 · R3 / R4: Echo × 2/3 → GPIO18</text>
<text x="8" y="110" font-family="Noto Sans,Arial,sans-serif" font-size="18" fill="#203040" text-anchor="start" font-weight="normal">R5 / R6: подтяжка D0 / DO к 3V3; у GPIO35 нет внутренней подтяжки.</text>
